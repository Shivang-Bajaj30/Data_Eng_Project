spring.application.name=notevault-backend
server.port=8080

# JWT (override in production via env vars / backend/.env)
notevault.jwt-secret=${JWT_SECRET:notevault-dev-secret-change-me}

# MongoDB Atlas — set MONGODB_URI in backend/.env or as an env var.
# The database name is pinned here and in MongoConfig.
spring.data.mongodb.database=notevault
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}

# Kafka producer is wired in production; demo events are mirrored to /api/admin/events.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb=WARN
